openapi: 3.0.3
info:
  title: "Stage 02 \u2014 Canonicalisation Service"
  version: 0.1.0
  description: Apply correction/deletion logic, standardise jurisdiction, period and currency, and produce
    one latest-valid canonical view while preserving source lineage.
paths:
  /run:
    post:
      summary: Execute this stage on a period / batch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                period:
                  type: string
                batch_id:
                  type: string
      responses:
        '202':
          description: Accepted; produces the stage artifact
  /result:
    get:
      summary: Fetch this stage's produced artifact
      parameters:
      - name: batch_id
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Canonical CbCR data set (latest valid)
