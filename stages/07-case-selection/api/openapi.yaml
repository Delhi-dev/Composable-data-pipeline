openapi: 3.0.3
info:
  title: "Stage 07 \u2014 Case Selection & Controlled Consumption Service"
  version: 0.1.0
  description: Apply selection cutoffs, generate explainable reason codes, build the case pack with internal
    evidence only, and hand off to case management under AUP.
paths:
  /run:
    post:
      summary: Execute this stage on a period / batch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                period:
                  type: string
                batch_id:
                  type: string
      responses:
        '202':
          description: Accepted; produces the stage artifact
  /result:
    get:
      summary: Fetch this stage's produced artifact
      parameters:
      - name: batch_id
        in: query
        schema:
          type: string
      responses:
        '200':
          description: AuditCase[] (internal evidence only)
