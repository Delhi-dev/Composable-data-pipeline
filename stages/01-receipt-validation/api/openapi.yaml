openapi: 3.0.3
info:
  title: "Stage 01 \u2014 Receipt & Validation Service"
  version: 0.1.0
  description: Receive the inbound CbCR message, run file-, metadata- and record-level validation, and
    accept / reject / hold it. Only accepted messages enter the pipeline.
paths:
  /run:
    post:
      summary: Execute this stage on a period / batch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                period:
                  type: string
                batch_id:
                  type: string
      responses:
        '202':
          description: Accepted; produces the stage artifact
  /result:
    get:
      summary: Fetch this stage's produced artifact
      parameters:
      - name: batch_id
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Accepted message + validation result
